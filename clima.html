<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reloj y clima ZISKOS</title>
<style>
:root{--fondo:#191919;--tarjeta:#252525;--borde:#2f2f2f;--tinta:#D4D4D4;--suave:#8A8A8A;--icono:#BDBDBD}
:root[data-tema="claro"]{--fondo:#ECEDEE;--tarjeta:#FFFFFF;--borde:#D9DADC;--tinta:#24272B;--suave:#6B6F75;--icono:#24272B}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:var(--fondo);color:var(--tinta)}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:12px}
.caja{width:100%;max-width:640px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:6px;padding:clamp(16px,4vw,28px)}
.arriba{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
#hora{font-size:clamp(48px,15vw,96px);font-weight:200;letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
#fecha{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--suave)}
.lugar{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--suave);margin-top:6px}
.fila{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:clamp(14px,3vw,22px)}
.ind{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border:1px solid var(--borde);border-radius:6px}
.circ{width:38px;height:38px;border:1.5px solid var(--icono);border-radius:50%;display:flex;align-items:center;justify-content:center}
.circ svg{width:20px;height:20px;stroke:var(--icono);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.val{font-size:clamp(15px,4vw,20px);font-weight:300;font-variant-numeric:tabular-nums}
.et{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--suave);text-align:center}
@media (max-width:380px){.fila{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="caja">
  <div class="arriba"><div id="hora">--:--</div><div><div id="fecha"></div><div class="lugar" id="lugar">Santiago</div></div></div>
  <div class="fila">
    <div class="ind"><div class="circ" id="icCielo"></div><div class="val" id="vCielo">—</div><div class="et" id="eCielo">Cielo</div></div>
    <div class="ind"><div class="circ"><svg viewBox="0 0 24 24"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg></div><div class="val" id="vTemp">—</div><div class="et" id="eTemp">Temperatura</div></div>
    <div class="ind"><div class="circ"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></div><div class="val" id="vHum">—</div><div class="et">Humedad</div></div>
    <div class="ind"><div class="circ"><svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg></div><div class="val" id="vViento">—</div><div class="et">Viento km/h</div></div>
  </div>
</div>
<script>
// Reloj y clima ZISKOS · sin cookies ni rastreo. Clima: Open-Meteo (gratis, sin clave). ?tema=claro · ?lat=&lon=&lugar=
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get('tema')) document.documentElement.setAttribute('data-tema',p.get('tema'));
  var lat=p.get('lat')||'-33.45', lon=p.get('lon')||'-70.67', zona='America/Santiago';
  if(p.get('lugar')) document.getElementById('lugar').textContent=p.get('lugar');
  var fh=new Intl.DateTimeFormat('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:zona});
  var ff=new Intl.DateTimeFormat('es-CL',{weekday:'long',day:'numeric',month:'long',timeZone:zona});
  function tick(){var d=new Date();document.getElementById('hora').textContent=fh.format(d);document.getElementById('fecha').textContent=ff.format(d);setTimeout(tick,60000-d.getSeconds()*1000-d.getMilliseconds());}
  tick();
  var I={sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    nube:'<path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.5A3.3 3.3 0 0 0 7 18z"/>',
    parcial:'<path d="M8 3v1M3.5 5.5l.8.8M2 10h1M12.5 5.5l-.8.8"/><path d="M5.5 11a3 3 0 0 1 5.3-2.5"/><path d="M9 20h8a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.3A2.9 2.9 0 0 0 9 20z"/>',
    lluvia:'<path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
    nieve:'<path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M8 19h.01M12 19h.01M16 19h.01M10 22h.01M14 22h.01"/>',
    tormenta:'<path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M12 15l-2 4h3l-2 4"/>',
    niebla:'<path d="M4 9h16M3 13h18M5 17h14"/>'};
  function tipo(c){if(c===0)return['sol','Despejado'];if(c<=2)return['parcial','Parcial'];if(c===3)return['nube','Nublado'];if(c<=48)return['niebla','Niebla'];if(c<=67||(c>=80&&c<=82))return['lluvia','Lluvia'];if(c<=77||c===85||c===86)return['nieve','Nieve'];return['tormenta','Tormenta'];}
  function clima(){
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone='+encodeURIComponent(zona)+'&forecast_days=1',{referrerPolicy:'no-referrer',credentials:'omit'})
    .then(function(r){return r.json();}).then(function(j){
      var c=j.current, t=tipo(c.weather_code);
      document.getElementById('icCielo').innerHTML='<svg viewBox="0 0 24 24">'+I[t[0]]+'</svg>';
      document.getElementById('vCielo').textContent=t[1];
      document.getElementById('vTemp').textContent=Math.round(c.temperature_2m)+'°';
      document.getElementById('eTemp').textContent=Math.round(j.daily.temperature_2m_min[0])+'° / '+Math.round(j.daily.temperature_2m_max[0])+'°';
      document.getElementById('vHum').textContent=Math.round(c.relative_humidity_2m)+'%';
      document.getElementById('vViento').textContent=Math.round(c.wind_speed_10m);
    }).catch(function(){document.getElementById('vCielo').textContent='Sin datos';});
  }
  clima(); setInterval(clima,15*60*1000);
})();
</script>
</body>
</html>
